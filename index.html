<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>전국 장사왕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;600;700;800;900&family=Nanum+Myeongjo:wght@800&display=swap" />
  <style>/* 전국 장사왕 — 시각 규칙 v2
   - 화면(UI)은 차분한 흰 면 + 얇은 선 + 부드러운 그림자. 강조색은 주황(행동)·금색(돈)·민트(성장) 세 가지만.
   - 거리 일러스트가 주인공이 되도록 UI는 한발 물러선다. 간판체(Black Han Sans)는 로고와 거리 간판에만.
   - 상승=빨강, 하락=파랑 (한국 시세 표기). 그라데이션·네온·유리 효과 없음. */
:root {
  --bg: #F3EFE8; --surface: #FFFFFF; --surface2: #FAF7F2; --line: #E8E1D5; --line2: #D9D0C1;
  --text: #232A38; --text2: #6B7080; --text3: #9A9EA8;
  --primary: #FF6A3D; --primary-d: #E4542A; --primary-soft: #FFF0E8;
  --gold: #F6B73C; --gold-d: #C98C14; --gold-soft: #FFF6E0;
  --mint: #1FA67F; --mint-d: #158665; --mint-soft: #E7F6F0;
  --blue: #3A6FD8; --navy: #232A38;
  --up: #E2483A; --down: #3A6FD8; --warn: #D9731F;
  --r: 14px; --sh1: 0 1px 2px rgba(35,42,56,.06), 0 4px 14px rgba(35,42,56,.07); --sh2: 0 8px 30px rgba(35,42,56,.18);
  --fs: 17px; --sign: 'Black Han Sans', 'Gothic A1', sans-serif; --body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; --serif: 'Nanum Myeongjo', serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html.big-text { --fs: 19.5px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #E2DCD1; }
body { word-break: keep-all; font-family: var(--body); font-size: var(--fs); color: var(--text); font-weight: 700; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
b { font-weight: 800; }
.up { color: var(--up); } .down { color: var(--down); }
.muted { color: var(--text2); font-weight: 600; } .small { font-size: .82em; } .center { text-align: center; }

.app { position: relative; max-width: 520px; height: 100dvh; margin: 0 auto; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden; }

/* ---------- 상단 ---------- */
.topbar { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px; padding: 10px 12px 14px; background: var(--surface); position: relative; z-index: 5; box-shadow: 0 1px 0 var(--line); }
.rank-seal { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 70px; }
.rank-seal small { font-size: 12px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-seal b { font-size: 14px; font-weight: 900; color: var(--primary-d); background: var(--primary-soft); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.cash { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.cash-main { display: flex; align-items: center; gap: 6px; font-size: 25px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; }
.cash-main.long { font-size: 21px; } .cash-main.longer { font-size: 18px; }
.cash-sub { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
.cash { overflow: hidden; }
.icon-btn { width: 46px; height: 46px; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 0; transition: transform .08s; }
.icon-btn:active { transform: scale(.94); }
.daybar { position: absolute; left: 12px; right: 12px; bottom: 5px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.daybar i { display: block; height: 100%; background: var(--gold); border-radius: 2px; transition: width .3s linear; }

.content { min-height: 0; overflow: hidden; position: relative; }
.content:not(.tab-street) { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- 거리 ---------- */
.street { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.districts { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--line); }
.districts::-webkit-scrollbar { display: none; }
.districts.inline { background: none; border: 0; padding: 4px 0 8px; }
.dist-tab { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 4px 14px; border: 1px solid var(--line2); border-radius: 999px; background: var(--surface); color: var(--text); transition: background .15s, color .15s; }
.dist-tab b { font-weight: 900; font-size: 15.5px; }
.dist-tab small { font-size: 11.5px; color: var(--text3); font-weight: 700; }
.dist-tab.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.dist-tab.locked { background: var(--surface2); color: var(--text3); border-style: dashed; }
.dist-tab.locked svg { opacity: .55; }
.street-scroll { overflow-x: auto; overflow-y: hidden; min-height: 0; scrollbar-width: none; touch-action: pan-x; background: #50545E; scroll-behavior: smooth; }
.street-scroll::-webkit-scrollbar { display: none; }
.street-svg { display: block; }
.street-label { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface); border-top: 1px solid var(--line); font-size: 13px; white-space: nowrap; overflow: hidden; }
.street-label b { font-weight: 900; font-size: 14px; }
.street-label span { font-weight: 600; color: var(--text2); overflow: hidden; text-overflow: ellipsis; }
.street-label .traffic { margin-left: auto; color: var(--mint-d); font-weight: 800; background: var(--mint-soft); padding: 2px 8px; border-radius: 999px; }
.tap { cursor: pointer; }
.tap:active .bld, .tap:active .stall, .tap:active .stall-empty { filter: brightness(1.06); }
.sky { transition: fill 4s linear; }
.walk-r { animation-name: walkR; animation-timing-function: linear; animation-iteration-count: infinite; }
.walk-l { animation-name: walkL; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes walkR { from { transform: translateX(-40px); } to { transform: translateX(var(--w)); } }
@keyframes walkL { from { transform: translateX(var(--w)); } to { transform: translateX(-40px); } }
.exit { animation: exitWalk 4.2s linear forwards; }
@keyframes exitWalk { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(var(--dx)); opacity: 0; } }
.legs .leg1 { animation: leg .5s ease-in-out infinite alternate; transform-origin: -3px -16px; }
.legs .leg2 { animation: leg .5s ease-in-out infinite alternate-reverse; transform-origin: 3px -16px; }
@keyframes leg { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
.idle { animation: idle 1.6s ease-in-out infinite; }
.idle .legs path { animation: none; }
@keyframes idle { 50% { transform: translateY(-1.5px); } }
.steam { animation: steam 2.2s ease-in-out infinite; }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-9px); } }
.bulb { animation: bulb 1.6s ease-in-out infinite; }
@keyframes bulb { 50% { opacity: .6; } }
.cloud { animation: cloud 80s linear infinite alternate; }
@keyframes cloud { from { transform: translateX(-80px); } to { transform: translateX(80px); } }
.pop { animation: popFade 1.3s ease-out forwards; }
@keyframes popFade { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.pop text, .pop circle { animation: rise 1.3s cubic-bezier(.15,.8,.3,1) forwards; }
@keyframes rise { from { transform: translateY(8px); } to { transform: translateY(-46px); } }
.hint path { animation: hintb 1s ease-in-out infinite; }
@keyframes hintb { 50% { transform: translateY(9px); } }
.scaffold { animation: scaffold 1.3s ease-in forwards; }
@keyframes scaffold { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.flag { animation: flag 2.4s ease-in-out infinite; transform-box: fill-box; }
@keyframes flag { 50% { transform: skewY(-3deg); } }

/* ---------- 목표 / 하단 메뉴 ---------- */
.questbar { display: flex; align-items: center; gap: 10px; margin: 8px 10px; padding: 10px 12px; background: var(--surface); border-radius: var(--r); box-shadow: var(--sh1); border: 1px solid var(--line); position: relative; overflow: hidden; }
.questbar::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
.questbar.ready { background: var(--gold-soft); border-color: #F1D79A; }
.questbar.ready::before { background: var(--gold); }
.q-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.q-text small { font-size: 12px; color: var(--primary-d); font-weight: 900; }
.q-text b { font-weight: 900; font-size: 17px; line-height: 1.2; }
.q-text span { font-size: 13.5px; color: var(--text2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-reward { display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; color: var(--text2); }
.q-reward b { font-size: 15px; color: var(--gold-d); }
.questbar.ready .btn { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.04); } }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); padding: 4px 6px calc(6px + var(--safe-b)); gap: 2px; box-shadow: 0 -1px 0 var(--line); }
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 60px; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: var(--text3); transition: color .15s, background .15s; }
.nav button span { font-size: 13.5px; font-weight: 800; }
.nav button svg { filter: grayscale(1); opacity: .55; transition: filter .15s, opacity .15s; }
.nav button.on { color: var(--text); background: var(--surface2); }
.nav button.on svg { filter: none; opacity: 1; }
.nav button.on::before { content: ''; position: absolute; top: 0; left: 32%; right: 32%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
.nav .dot { position: absolute; top: 8px; right: 26%; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--surface); }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; padding: 6px 18px; border: 0; border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.13); font-weight: 900; line-height: 1.15; transition: transform .07s, filter .1s; user-select: none; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); box-shadow: inset 0 -1px 0 rgba(0,0,0,.13); }
.btn:disabled { background: #E7E2D9 !important; color: #A9A497 !important; box-shadow: none; cursor: default; }
.btn .btn-main { display: inline-flex; align-items: center; gap: 6px; font-size: 1em; }
.btn .btn-sub { font-size: .74em; font-weight: 700; opacity: .9; margin-top: 2px; }
.btn-sm { min-height: 42px; padding: 4px 12px; font-size: .9em; }
.btn-lg { min-height: 60px; font-size: 1.08em; }
.btn.wide { width: 100%; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-gold { background: var(--gold); color: #3B2A05; }
.btn-mint { background: var(--mint); color: #fff; }
.btn-navy { background: var(--navy); color: #FFD77A; }
.btn-plain { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn-plain:active:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn-danger { background: #C2412D; color: #fff; }
.text-btn { background: none; border: 0; padding: 10px 4px; font-weight: 700; font-size: 15px; color: var(--text2); }
.text-btn.danger { color: #B8442F; }
.round-btn { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--surface2); box-shadow: inset 0 0 0 1.5px var(--line2); display: grid; place-items: center; padding: 0; transition: transform .07s; }
.round-btn:active:not(:disabled) { transform: scale(.93); background: var(--primary-soft); }
.round-btn:disabled { opacity: .35; }

/* ---------- 시트 ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 30; background: rgba(28,33,45,.42); display: flex; align-items: flex-end; animation: fade .18s; }
.sheet-wrap.out { animation: fadeOut .17s forwards; }
.sheet-wrap.out .sheet { animation: sheetOut .17s forwards; }
@keyframes fade { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
.sheet { width: 100%; max-height: 90%; display: flex; flex-direction: column; background: var(--bg); border-radius: 22px 22px 0 0; animation: sheetIn .26s cubic-bezier(.2,.9,.25,1); box-shadow: var(--sh2); }
@keyframes sheetIn { from { transform: translateY(60%); } } @keyframes sheetOut { to { transform: translateY(40%); } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 18px 14px 10px 18px; position: relative; background: var(--bg); border-radius: 22px 22px 0 0; }
.sheet-head::before { content: ''; position: absolute; top: 7px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--line2); }
.sheet-title { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-left: 12px; border-left: 4px solid var(--navy); }
.plate-red .sheet-title { border-color: var(--primary); } .plate-mint .sheet-title { border-color: var(--mint); } .plate-gold .sheet-title { border-color: var(--gold); }
.sheet-title b { font-weight: 900; font-size: 22px; letter-spacing: -.02em; }
.sheet-title span { font-size: 14px; font-weight: 700; color: var(--text2); }
.sheet-head .icon-btn { border-radius: 50%; width: 44px; height: 44px; }
.sheet-body, .content { scrollbar-width: none; } .sheet-body::-webkit-scrollbar, .content::-webkit-scrollbar { display: none; }
.sheet-body { overflow-y: auto; padding: 4px 16px 22px; -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: 10px 14px calc(10px + var(--safe-b)); border-top: 1px solid var(--line); }
.sheet-links { display: flex; justify-content: space-between; margin-top: 6px; }

.sec { margin: 16px 0 6px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec-head h3 { margin: 0; font-weight: 900; font-size: 18px; letter-spacing: -.02em; }
.sec-head .muted, .sec-head > span { font-size: 12.5px; color: var(--text2); font-weight: 700; }
.page { padding: 12px 12px 24px; }
.card, .stat, .slot, .biz-card, .pick, .my-bld, .listing, .bld-card, .ledger-today, .set-row, .next-rank, .card-staff { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh1); }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.stat span { font-size: 12.5px; color: var(--text2); font-weight: 700; }
.stat b { font-size: 16.5px; font-variant-numeric: tabular-nums; }
.stat.warn b { color: var(--warn); }
.alert { background: var(--gold-soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: #6B4A0B; font-weight: 700; }

/* 가게 */
.shop-hero { display: grid; grid-template-columns: 48% 1fr; gap: 12px; align-items: center; }
.front-preview { width: 100%; height: auto; display: block; background: #D9E8EC; border-radius: 12px; }
.hero-kpi { display: flex; flex-direction: column; }
.hero-kpi span { font-size: 13.5px; color: var(--text2); }
.hero-kpi b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.hero-kpi small { font-size: 13px; color: var(--text2); margin-top: 3px; font-weight: 600; line-height: 1.35; }
.price-row { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; align-items: center; }
.price-box { text-align: center; background: var(--surface); border-radius: 14px; padding: 8px 4px; box-shadow: var(--sh1); border: 1px solid var(--line); }
.price-box b { display: block; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.price-box b i { font-style: normal; font-size: 17px; margin-left: 2px; color: var(--text2); }
.price-box span { font-size: 12.5px; color: var(--text2); font-weight: 600; }
.mood { font-size: 12.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.m-적당 { background: var(--mint-soft); color: var(--mint-d); } .m-싸다, .m-너무쌈 { background: #EAF0FC; color: var(--blue); } .m-비싸다 { background: var(--gold-soft); color: #9A6A09; } .m-너무비쌈 { background: #FDE9E6; color: #C2412D; }
.forecast { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 10px 2px 12px; font-size: 14.5px; color: var(--text2); font-weight: 600; }
.forecast b { color: var(--text); }
.forecast span { display: inline-flex; align-items: center; gap: 4px; }
.forecast em { font-style: normal; color: var(--warn); font-weight: 800; }
.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; }
.slot.empty { grid-template-columns: auto 1fr; min-height: 64px; background: transparent; box-shadow: none; border: 1.5px dashed var(--line2); font-weight: 800; color: var(--text2); }
.slot.empty svg { opacity: .5; }
.slot-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
.slot-info b { font-size: 17px; } .slot-info span { font-size: 12.5px; color: var(--text2); font-weight: 600; }
.slot-info .fav { color: var(--mint-d); font-weight: 800; }
.upgrade { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--sh1); border: 1px solid var(--line); }
.up-info { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; color: var(--text2); font-weight: 600; }
.up-info b { font-weight: 900; font-size: 17px; color: var(--text); }
.done-note { background: var(--gold-soft); padding: 12px; border-radius: 12px; }
.lead { margin: 2px 0 12px; font-size: 15px; color: var(--text2); font-weight: 600; }
.empty-note { text-align: center; padding: 16px; background: var(--surface2); border: 1.5px dashed var(--line2); border-radius: var(--r); }
.empty-note p { margin: 4px 0; }

/* 창업 */
.biz-list { display: grid; gap: 8px; }
.biz-card { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 10px; }
.biz-card.locked { opacity: .55; }
.biz-sign { height: 58px; display: grid; place-items: center; border-radius: 10px; font-family: var(--sign); font-size: 16px; text-align: center; line-height: 1.05; padding: 2px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.biz-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.biz-info b { font-weight: 900; font-size: 17.5px; }
.biz-info span { font-size: 12.5px; color: var(--text2); font-weight: 600; }
.biz-info .biz-num { color: var(--text); font-size: 13.5px; } .biz-num em { font-style: normal; font-weight: 900; }
.lock-note { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--text2); }

/* 직원 */
.portrait { position: relative; flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: #EFE8DA; }
.portrait.framed { box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(35,42,56,.15); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait.g-R { background: #DDF1E9; } .portrait.g-SR { background: #DEE7F8; } .portrait.g-SSR { background: #FBE2DA; } .portrait.g-UR { background: #F8E7B8; }
.grade-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 3px; border-radius: 6px; font-size: 12px; font-weight: 900; white-space: nowrap; }
.grade-tag b { background: rgba(255,255,255,.22); padding: 0 4px; border-radius: 4px; font-size: 11px; }
.grade-tag.big { font-size: 15px; padding: 3px 10px 3px 4px; }
.board { background: transparent; }
.board-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.board-title b { font-weight: 900; font-size: 19px; }
.posters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.poster { position: relative; background: var(--surface); border-radius: 16px; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--sh1); border: 1px solid var(--line); overflow: hidden; }
.poster-title { margin: 0 -10px 4px; padding: 14px 10px 12px; font-weight: 900; font-size: 18px; text-align: center; background: var(--mint-soft); color: var(--mint-d); }
.p-premium .poster-title { background: var(--navy); color: #FFD77A; }
.pin { display: none; }
.poster-sub { font-size: 12.5px; text-align: center; color: var(--text2); font-weight: 600; min-height: 2.6em; }

.poster-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }

.card-staff.g-SSR { box-shadow: var(--sh1), inset 0 0 0 2px #F3B7A8; } .card-staff.g-UR { box-shadow: var(--sh1), inset 0 0 0 2px var(--gold); background: #FFFBEF; }
.stars { position: absolute; top: 10px; right: 10px; color: var(--gold); font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.dex { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.staff-hero { display: grid; grid-template-columns: 124px 1fr; gap: 14px; align-items: center; }

.bars { display: grid; gap: 8px; margin: 14px 0; }

.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; } .bar.c1 i { background: var(--primary); } .bar.c2 i { background: var(--mint); } .bar.c3 i { background: var(--blue); }
.bars em { font-style: normal; font-weight: 900; text-align: right; }
.assign-list { display: flex; flex-wrap: wrap; gap: 6px; }

.assign small { font-size: 11.5px; color: var(--text2); font-weight: 600; }
.assign.on { background: var(--mint); color: #fff; box-shadow: none; } .assign.on small { color: #DDF5EC; }
.pick-list { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 8px 10px; transition: transform .08s; }

.rates th, .rates td { border-bottom: 1px solid var(--line); padding: 8px 2px; } .rates thead th { background: var(--surface2); font-size: 13px; }

.rs-title { font-weight: 900; font-size: 24px; color: #FFE2A0; margin-bottom: 16px; text-align: center; letter-spacing: -.02em; }
.rs-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.rs-grid.single { grid-template-columns: minmax(0, 240px); justify-content: center; }

.rs-grid.single .rs-card { aspect-ratio: .62; }
@keyframes drop { from { transform: translateY(-50px) rotate(-5deg); opacity: 0; } }
.rs-back, .rs-front { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; transition: transform .45s cubic-bezier(.3,.7,.3,1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.rs-back { background: #F1E9DA; box-shadow: inset 0 0 0 5px #fff; }

.rs-front { background: var(--surface); transform: rotateY(180deg); gap: 4px; padding: 5px; overflow: hidden; }
.rs-card.open .rs-back { transform: rotateY(-180deg); } .rs-card.open .rs-front { transform: rotateY(0); }
.rs-front b { font-size: 12.5px; } .rs-grid.single .rs-front b { font-size: 24px; }

.rs-grid:not(.single) .rs-front { justify-content: flex-start; padding-top: 6px; }
.rs-grid:not(.single) .rs-front .grade-tag { font-size: 10px; padding: 1px 5px 1px 2px; } .rs-grid:not(.single) .rs-front .grade-tag b { font-size: 9.5px; } .rs-grid.single .rs-front .portrait { width: 78% !important; }
.rs-card.g-R .rs-front { background: #F2FAF6; } .rs-card.g-SR .rs-front { background: #F1F5FD; }
.rs-card.g-SSR .rs-front { background: #FFF4F0; box-shadow: inset 0 0 0 3px #F3A08C; } .rs-card.g-UR .rs-front { background: #FFF8E4; box-shadow: inset 0 0 0 3px var(--gold); }
.rs-card.open.g-SSR, .rs-card.open.g-UR { animation: shine .7s ease-out; }
@keyframes shine { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
.stamp-ok { position: absolute; top: 8px; right: 6px; font-family: var(--sign); font-size: 12px; color: var(--up); border: 2px solid var(--up); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; transform: rotate(14deg); background: rgba(255,255,255,.75); animation: stampIn .3s .25s backwards; }
.rs-grid.single .stamp-ok { width: 62px; height: 62px; font-size: 19px; }
@keyframes stampIn { from { transform: rotate(14deg) scale(2.2); opacity: 0; } }
.rs-front .dup { font-size: 10.5px; color: var(--gold-d); font-weight: 800; text-align: center; } .rs-grid.single .rs-front .dup { font-size: 14px; }
.rs-foot { color: #A8AEBD; margin-top: 18px; font-size: 14.5px; font-weight: 600; }

/* 부동산 */
.my-blds { display: grid; gap: 8px; }
.my-bld, .listing { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; padding: 8px 12px 8px 8px; transition: transform .08s; }

.listing.hot { background: #FFFBF0; border-color: #F1D79A; } .listing.own { background: #F4FBF8; border-color: #BFE4D6; }
.thumb { display: block; border-radius: 10px; background: #D9E8EC; }
.mb-info, .li-info { display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; min-width: 0; font-weight: 600; color: var(--text2); }
.mb-info b, .li-info b { font-weight: 900; font-size: 17px; color: var(--text); }

.li-info .row { display: flex; gap: 6px; align-items: center; }
.li-price { font-size: 17px; font-weight: 900; color: var(--text); }

.tag-own { background: var(--mint); }
.listings { display: grid; gap: 8px; margin-top: 8px; }
.market { display: flex; justify-content: space-between; align-items: center; background: var(--navy); color: #fff; border-radius: var(--r); padding: 10px 14px; }
.market > div { display: flex; flex-direction: column; }

.bld-card { padding: 12px; }
.bld-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.rung.done b { color: var(--text2); } .rung.done { background: var(--surface2); }
.rung.now { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 10px rgba(255,106,61,.35); } .rung.now b { color: #fff; }
.next-rank { padding: 12px; font-size: 14.5px; display: flex; flex-direction: column; gap: 3px; font-weight: 600; color: var(--text2); }
.next-rank b { font-weight: 900; font-size: 18px; color: var(--primary-d); }
.next-rank span { color: var(--mint-d); font-weight: 800; }
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ranking li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); }
.ranking li.me { background: var(--primary-soft); border-color: #FFC6B0; }
.ranking .no { font-weight: 900; font-size: 17px; color: var(--text3); text-align: center; }
.ranking li:nth-child(-n+3) .no { color: var(--gold-d); }

/* 토스트·영수증·모달 */
.toasts { position: absolute; top: 86px; left: 0; right: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { max-width: 88%; background: rgba(35,42,56,.94); color: #fff; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 700; box-shadow: var(--sh2); animation: toastIn .28s cubic-bezier(.2,.9,.3,1.2); }
.toast.t-ok { background: rgba(21,134,101,.95); } .toast.t-err { background: rgba(194,65,45,.95); }
@keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } }
.receipt { position: absolute; top: 80px; right: 10px; z-index: 45; width: 176px; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px 12px; background: var(--surface); border: 0; border-radius: 12px; box-shadow: var(--sh2); font-size: 13px; font-weight: 600; color: var(--text2); animation: slip .4s cubic-bezier(.2,.9,.3,1.1); }
.receipt b { font-weight: 900; font-size: 14px; color: var(--text); padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px dashed var(--line2); }
.receipt em { font-style: normal; font-weight: 900; font-size: 15.5px; }
@keyframes slip { from { transform: translateX(30px); opacity: 0; } }
.receipt.leaving { animation: slipOut .35s forwards; }
@keyframes slipOut { to { transform: translateX(30px); opacity: 0; } }
.stamp-fx { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; pointer-events: none; background: rgba(28,33,45,.22); animation: fade .15s; }
.seal { width: 190px; height: 190px; border-radius: 50%; border: 6px solid var(--up); color: var(--up); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255,253,248,.94); transform: rotate(-12deg); animation: sealIn .45s cubic-bezier(.3,1.6,.5,1); box-shadow: inset 0 0 0 3px rgba(226,72,58,.3); }
.seal b { font-family: var(--sign); font-weight: 400; font-size: 38px; } .seal span { font-size: 15px; font-weight: 900; }
.seal.small { width: 70px; height: 70px; border-width: 3px; animation: none; position: absolute; right: 14px; bottom: 10px; }
.seal.small b { font-size: 17px; } .seal.small span { font-size: 10.5px; }
@keyframes sealIn { from { transform: rotate(-30deg) scale(2.2); opacity: 0; } 70% { transform: rotate(-10deg) scale(.96); opacity: 1; } }
.modal-wrap { position: absolute; inset: 0; z-index: 55; background: rgba(28,33,45,.5); display: grid; place-items: center; padding: 18px; animation: fade .18s; }
.modal { width: 100%; max-width: 380px; background: var(--bg); border-radius: 20px; padding: 18px; box-shadow: var(--sh2); animation: pop2 .28s cubic-bezier(.2,.9,.3,1.2); }

.modal h3 { margin: 0 0 6px; font-weight: 900; font-size: 21px; letter-spacing: -.02em; }

.big-money { font-size: 32px; font-weight: 900; text-align: center; margin: 12px 0; color: var(--up); letter-spacing: -.03em; }
.rankup .certificate { position: relative; background: #FFFDF6; border: 1px solid #E5D7B5; outline: 5px solid #F6EEDA; outline-offset: -11px; padding: 22px 16px 26px; text-align: center; margin: 2px 0 14px; border-radius: 6px; }
.certificate > span { font-family: var(--serif); font-weight: 800; font-size: 17px; letter-spacing: 12px; color: var(--text2); }
.certificate > b { display: block; font-family: var(--serif); font-weight: 800; font-size: 40px; color: var(--up); margin: 8px 0; }
.certificate p { font-size: 14px; font-family: var(--serif); color: var(--text); }
.reward-line { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line); margin-bottom: 6px; font-weight: 600; }
.settings { display: grid; gap: 8px; }
.set-row { display: flex; justify-content: space-between; align-items: center; min-height: 58px; padding: 6px 16px; font-size: 17px; font-weight: 800; }
.switch { width: 54px; height: 32px; border-radius: 16px; background: #D6D0C4; position: relative; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .18s; }

.ledger-today { display: flex; justify-content: space-between; padding: 10px 12px; margin-bottom: 10px; }
.ledger { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface); border-radius: 12px; overflow: hidden; }
.ledger th, .ledger td { border-bottom: 1px solid var(--line); padding: 8px 3px; text-align: right; } .ledger th { color: var(--text2); font-size: 12px; background: var(--surface2); } .ledger td:first-child, .ledger th:first-child { text-align: center; }

/* 첫 화면 */
.intro { position: absolute; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 24px 22px calc(24px + var(--safe-b)); }
.intro-logo { text-align: center; position: relative; }
.intro-logo .small { display: inline-block; font-family: var(--sign); font-size: 22px; color: #fff; background: var(--navy); padding: 3px 14px; border-radius: 8px; letter-spacing: 2px; }
.intro-logo b { display: block; font-family: var(--sign); font-weight: 400; font-size: 78px; line-height: 1; color: var(--primary); letter-spacing: 1px; text-shadow: 0 4px 0 #C9401C; margin-top: 6px; }
.intro-logo i { display: inline-block; font-style: normal; margin-top: 14px; font-size: 15px; font-weight: 800; color: var(--text2); letter-spacing: .1em; }
.passbook { background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--sh1); border: 1px solid var(--line); position: relative; overflow: hidden; }
.passbook::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--mint); }
.pb-head { display: flex; justify-content: space-between; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.pb-head b { font-weight: 900; font-size: 15.5px; color: var(--mint-d); } .pb-head span { font-size: 12.5px; color: var(--text3); }
.passbook table { width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; border-collapse: collapse; font-weight: 600; }
.passbook td { padding: 5px 0; color: var(--text2); } .passbook td:last-child { text-align: right; }
.passbook .in { color: var(--up); } .passbook .sum td { font-weight: 900; font-size: 19px; padding-top: 10px; color: var(--text); border-top: 1px solid var(--line); }
.intro-text { text-align: center; font-size: 16.5px; line-height: 1.65; margin: 0; color: var(--text2); font-weight: 600; }

@media (max-width: 360px) {
  .cash-main { font-size: 21px; } .rank-seal { min-width: 0; } .topbar { gap: 6px; padding: 8px 8px 12px; }

  .sec-head { flex-wrap: wrap; }

  .posters { grid-template-columns: 1fr; }

}
